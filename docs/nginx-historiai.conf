# Bản đang chạy trên VPS (/etc/nginx/sites-available/zz-historiai), 28/09/2026 — sau
# ap-ten-mien-historiai-org.sh, ap-header-bao-mat.sh, ap-websocket-lop-hoc.sh. Sửa trên VPS xong nhớ chép về đây.

server {
    listen 80;
    server_name historiai.org historiai.anhzap.shop;

    # Tên miền cũ: trang web chuyển sang historiai.org, còn /api/ và /health giữ
    # nguyên cho các bản cài Android đã phát ra (dựng sẵn gọi API ở tên miền cũ).
    if ($host = historiai.anhzap.shop) {
        rewrite ^/(?!api/|health$)(.*)$ https://historiai.org/$1 permanent;
    }

    root /home/giapdn/historiai/web;
    index index.html;
    include snippets/historiai-bao-mat.conf;

    # API cùng tên miền với web -> không còn vấn đề CORS
    # Thi trực tiếp (lớp học GĐ2): WebSocket — do docs/ap-websocket-lop-hoc.sh thêm
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Chat dùng SSE: phải tắt buffering, nếu không chữ dồn cục thay vì chạy dần
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
    }

    # Flutter web là SPA: mọi đường dẫn không thấy file thì trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ảnh, font, model 3D có thể cache lâu
    location ~* \.(png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include snippets/historiai-bao-mat.conf;
    }

    # Những file này phải LUÔN tươi.
    #
    # main.dart.js là toàn bộ ứng dụng Flutter, mà Flutter KHÔNG gắn mã băm vào
    # tên nó. Thiếu nó trong danh sách này thì Cloudflare giữ bản cũ 4 tiếng
    # (max-age=14400 mặc định cho .js) — deploy xong người dùng vẫn chạy code cũ,
    # và rất mất công truy vì mọi thứ phía máy chủ đều đúng.
    # Model 3D: kiểu MIME đúng để Scene Viewer nhận, và KHÔNG immutable vì
    # tên tệp không đổi khi nội dung đổi.
    location ~* \.(glb|gltf|usdz)$ {
        types {
            model/gltf-binary   glb;
            model/gltf+json     gltf;
            model/vnd.usdz+zip  usdz;
        }
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        include snippets/historiai-bao-mat.conf;
    }

    location ~* /(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json|phien-ban\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
        include snippets/historiai-bao-mat.conf;
    }
}

# www → tên miền chính
server {
    listen 80;
    server_name www.historiai.org;
    return 301 https://historiai.org$request_uri;
}
