name: historiai
description: HistoriAI - Học Lịch sử Việt Nam qua AI, 3D & AR
publish_to: "none"
version: 0.5.5+13

environment:
  # webview_flutter cần Dart >= 3.6. Ghi đúng ở đây thì máy nào
  # SDK cũ sẽ báo lỗi ngay lúc `pub get`, thay vì đỏ ở CI.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0          # hiển thị icon điều hướng SVG
  http: ^1.2.2                # gọi REST API backend
  provider: ^6.1.2            # quản lý state đơn giản
  shared_preferences: ^2.3.3  # lưu token đăng nhập
  video_player: ^2.9.2        # phát video 3D Cinematic (.mp4)
  audioplayers: ^6.1.0        # phát giọng nói AI Voice
  web: ^1.1.0                 # nhúng iframe viewer.html (3D trên web)
  webview_flutter: ^4.13.0    # nhúng viewer.html trên Android (3D trên điện thoại)
  url_launcher: ^6.3.1        # mở Scene Viewer để đặt cổ vật vào phòng (AR)
  sentry_flutter: ^9.30.1    # theo dõi lỗi — chỉ bật khi dựng kèm --dart-define=SENTRY_DSN
  package_info_plus: ^10.2.1   # đọc số bản cài để báo khi có bản mới (lib/core/ban_moi.dart)
  google_sign_in: ^7.2.0       # "Tiếp tục với Google" — chỉ hiện khi dựng kèm --dart-define=GOOGLE_CLIENT_ID
  google_sign_in_web: ^1.1.3   # nút GIS chính thức trên web (lib/features/auth/nut_google_web.dart)
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3   # chế độ thi trực tiếp (lib/features/lop_hoc/truc_tiep/) — WebSocket chạy cả web lẫn Android
  image_picker: ^1.2.3
  # ar_flutter_plugin: ^0.7.3 # mở khoá khi làm AR thật (ARCore/ARKit)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/portraits/
    - assets/figures3d/tran-hung-dao/
    - assets/figures3d/quang-trung/
    - assets/figures3d/item/
    - assets/figures3d/item_transparent/
    - assets/icons/nav/
    - assets/fonts/
    - assets/events/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 500
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 600
